name: Detekt Integration Verification

on:
  push:
    branches: ['ci/detekt-verification']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detekt-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Committed baseline gate / Ubuntu / JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_OVERRIDE: 4.0.0-LOCAL
      DETEKT_ARGS: >-
        --continue --console=plain --max-workers=2
        "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2048m"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.2.0
      - uses: android-actions/setup-android@v4

      - name: Verify credential-free environment and record toolchain
        shell: bash
        run: |
          test ! -f .env
          test ! -f androidApp/google-services.json
          java -version
          ./gradlew --version

      - name: Test reconciliation and experimental-policy safety
        run: python3 -m unittest discover -s scripts/detekt -p 'test_*.py' -v

      - name: Validate complete rule policy
        run: ./gradlew validateDetektPolicy --configuration-cache --console=plain -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Verify configuration-cache reuse
        run: ./gradlew validateDetektPolicy --configuration-cache --console=plain -Dorg.gradle.jvmargs=-Xmx4096m

      - name: Reconcile committed baselines against the preserved initial inventory
        shell: bash
        run: |
          mkdir -p build/detekt-verification/reference-inventory
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          bundle = Path('config/detekt/initial-inventory/reports.tar.gz')
          proof = json.loads(Path('config/detekt/initial-inventory/adoption-proof.json').read_text())
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == proof['reports_bundle_sha256']
          destination = Path('build/detekt-verification/reference-inventory')
          with tarfile.open(bundle) as archive:
              for member in archive:
                  assert member.isfile() and member.name == Path(member.name).name, member.name
                  with archive.extractfile(member) as source:
                      contents = source.read()
                  assert hashlib.sha256(contents).hexdigest() == proof['initial_report_sha256'][member.name]
                  (destination / member.name).write_bytes(contents)
          print('Verified and safely extracted the preserved initial reports.')
          PY
          python3 scripts/detekt/verify-merged-reports.py \
            --reports build/detekt-verification/reference-inventory
          python3 scripts/detekt/report-inventory.py \
            --reports build/detekt-verification/reference-inventory \
            --baseline-dir config/detekt/baseline \
            --output build/detekt-verification/committed-baseline-reconciliation.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          proof = json.loads(Path('config/detekt/initial-inventory/adoption-proof.json').read_text())
          bundle = Path('config/detekt/initial-inventory/reports.tar.gz')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == proof['reports_bundle_sha256']
          for name, expected in proof['baseline_sha256_before_and_after'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print('Committed baselines and initial report bundle match verified CI evidence.')
          PY

      - name: Run the complete gate without regenerating baselines
        shell: bash
        run: |
          set -o pipefail
          make detekt-ci 2>&1 | tee build/detekt-verification/committed-baseline-gate.txt

      - name: Prove new syntax and type-aware findings fail without baseline changes
        run: python3 scripts/detekt/verify-new-findings.py

      - name: Summarize reports
        if: always()
        shell: bash
        run: |
          if compgen -G 'build/reports/detekt/*.sarif' >/dev/null; then
            python3 scripts/detekt/report-inventory.py \
              --reports build/reports/detekt \
              --output build/detekt-verification/findings-summary.json \
              --html-index build/reports/detekt/index.html
          fi

      - name: Preserve findings and verification logs
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: detekt-committed-gate-${{ github.sha }}
          path: |
            build/reports/detekt/
            build/detekt-verification/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 7
