name: Engagement Cloud SDK CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags-ignore:
      - '*'

env:
  USE_LOCAL_DEPENDENCY: ${{ vars.USE_LOCAL_DEPENDENCY }}
  GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
  RELEASE_MODE: ${{ vars.RELEASE_MODE }}
  ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
  ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
  ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
  ANDROID_RELEASE_STORE_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_STORE_FILE_BASE64 }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_SERVER_CLIENT_ID }}
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
  OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
  SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
  SONATYPE_SIGNING_KEY_ID: ${{ secrets.SONATYPE_SIGNING_KEY_ID }}
  SONATYPE_SIGNING_PASSWORD: ${{ secrets.SONATYPE_SIGNING_PASSWORD }}
  SONATYPE_SIGNING_SECRET_KEY_RING_FILE: ${{ secrets.SONATYPE_SIGNING_SECRET_KEY_RING_FILE }}
  DETECT_LATEST_RELEASE_VERSION: ${{ vars.DETECT_LATEST_RELEASE_VERSION }}
  DETECT_PROJECT_USER_GROUPS: ${{ vars.DETECT_PROJECT_USER_GROUPS }}
  DETECT_PROJECT_VERSION_DISTRIBUTION: ${{ vars.DETECT_PROJECT_VERSION_DISTRIBUTION }}
  BLACKDUCK_ACCESS_TOKEN: ${{ secrets.BLACKDUCK_ACCESS_TOKEN }}
  BLACKDUCK_URL: ${{ vars.BLACKDUCK_URL }}
  SLACK_ICON: https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Kotlin_Icon.svg/1200px-Kotlin_Icon.svg.png
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  SPM_BUILD: ${{ vars.SPM_BUILD }}

jobs:
  derive-version:
    name: Derive Snapshot Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.snapshot-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Derive snapshot version
        id: snapshot-version
        run: |
          if git describe --tags --match '[0-9]*.[0-9]*.[0-9]*' >/dev/null 2>&1; then
            TAG=$(git describe --tags --match '[0-9]*.[0-9]*.[0-9]*' --abbrev=0)
            COMMITS=$(git rev-list "${TAG}..HEAD" --count)
            if [ "$COMMITS" -eq 0 ]; then
              VERSION="$TAG"
            else
              VERSION="${TAG}-${COMMITS}"
            fi
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: $VERSION"

  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.os }}
    needs: derive-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: web
            os: ubuntu-latest
          - platform: ios
            os: macos-latest-xlarge

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: make build-${{ matrix.platform }}
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

  test:
    name: Test ${{ matrix.platform }} / ${{ matrix.os }}
    needs: [derive-version, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: web
            os: ubuntu-latest
          - platform: ios
            os: macos-latest-xlarge

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4

      - name: Enable KVM group permissions
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android Emulator & Test
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            make test-android
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

      - name: Test iOS
        if: matrix.platform == 'ios'
        run: make test-ios
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

      - name: Setup Node.js
        if: matrix.platform == 'web'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Setup Chrome
        if: matrix.platform == 'web'
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Test Web
        if: matrix.platform == 'web'
        run: make test-web
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

  lint:
    needs: [derive-version, build]
    runs-on: macos-latest-xlarge
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run lint
        run: make lint
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

  publish-android:
    name: Publish KMP Snapshot
    if: github.ref == 'refs/heads/main'
    needs: [derive-version, test, lint]
    runs-on: macos-latest-xlarge
    concurrency:
      group: publish-kmp-snapshot
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        run: make pipeline-android
        env:
          PUBLISH: true
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}

  publish-js:
    name: Publish JS Snapshot
    if: github.ref == 'refs/heads/main'
    needs: [derive-version, test, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-js-snapshot
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Run JS Pipeline (Build, Test)
        run: make pipeline-js
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

      - name: Assemble NPM package
        run: make assemble-npm-package

      - name: Replace namespace for snapshot NPM release
        run: |
          sed 's/@sap\/engagement-cloud-sdk/@emartech\/engagement-cloud-sdk/' engagement-cloud-sdk/build/tmp/jsPublicPackageJson/package.json > dist/npm/package.json

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@emartech'

      - name: Publish to GitHub Packages NPM
        run: npm publish dist/npm/ --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble snapshot CDN artifacts
        run: |
          mkdir -p dist/cdn/snapshots

          # Main SDK bundle + sourcemap
          cp engagement-cloud-sdk/build/dist/js/productionExecutable/engagement-cloud-sdk-html.js \
            dist/cdn/snapshots/engagement-cloud-sdk.js
          cp engagement-cloud-sdk/build/dist/js/productionExecutable/engagement-cloud-sdk-html.js.map \
            dist/cdn/snapshots/engagement-cloud-sdk.js.map 2>/dev/null || true

          # Loader script + sourcemap
          cp engagement-cloud-sdk/build/dist/js/productionExecutable/engagement-cloud-sdk-loader.js \
            dist/cdn/snapshots/engagement-cloud-sdk-loader.js
          cp engagement-cloud-sdk/build/dist/js/productionExecutable/engagement-cloud-sdk-loader.js.map \
            dist/cdn/snapshots/engagement-cloud-sdk-loader.js.map 2>/dev/null || true

          # Service worker + sourcemap
          cp web-push-service-worker/build/dist/js/productionExecutable/ec-service-worker.js \
            dist/cdn/snapshots/ec-service-worker.js
          cp web-push-service-worker/build/dist/js/productionExecutable/ec-service-worker.js.map \
            dist/cdn/snapshots/ec-service-worker.js.map 2>/dev/null || true

          echo "Snapshot CDN artifacts:"
          ls -la dist/cdn/snapshots/

      - name: Deploy snapshots to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cdn
          keep_files: true
          destination_dir: .

  publish-ios-snapshot:
    name: Publish iOS Snapshot
    if: github.ref == 'refs/heads/main'
    needs: [derive-version, test, lint]
    runs-on: macos-latest-xlarge
    concurrency:
      group: publish-ios-snapshot
      cancel-in-progress: true
    permissions:
      contents: write
    env:
      SPM_BUILD: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Konan directory
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS XCFrameworks
        run: |
          ./gradlew \
            :engagement-cloud-sdk:assembleEngagementCloudSDKReleaseXCFramework \
            :ios-notification-service:assembleEngagementCloudNotificationServiceReleaseXCFramework \
            -PNATIVE_BUILD_TYPE=RELEASE \
            -PENABLE_PUBLISHING=true \
            --no-daemon
        env:
          VERSION_OVERRIDE: ${{ needs.derive-version.outputs.version }}

      - name: Copy Privacy Manifest to EC framework
        run: make add-privacy-manifest-to-frameworks

      - name: Zip XCFrameworks and compute checksums
        run: |
          cd engagement-cloud-sdk/build/XCFrameworks/release
          zip -r "$GITHUB_WORKSPACE/EngagementCloudSDK.xcframework.zip" EngagementCloudSDK.xcframework
          cd "$GITHUB_WORKSPACE"

          cd ios-notification-service/build/XCFrameworks/release
          zip -r "$GITHUB_WORKSPACE/EngagementCloudSDKNotificationService.xcframework.zip" EngagementCloudSDKNotificationService.xcframework
          cd "$GITHUB_WORKSPACE"

          echo "SDK_CHECKSUM=$(shasum -a 256 EngagementCloudSDK.xcframework.zip | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "NS_CHECKSUM=$(shasum -a 256 EngagementCloudSDKNotificationService.xcframework.zip | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Recreate snapshot-latest pre-release with zips
        run: |
          gh release delete snapshot-latest --yes --cleanup-tag || true

          gh release create snapshot-latest \
            --title "Snapshot (${{ needs.derive-version.outputs.version }})" \
            --notes "Rolling snapshot built from main. Not for production use. Built from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}" \
            EngagementCloudSDK.xcframework.zip \
            EngagementCloudSDKNotificationService.xcframework.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snapshot Package.swift
        run: |
          SDK_URL="https://github.com/${{ github.repository }}/releases/download/snapshot-latest/EngagementCloudSDK.xcframework.zip"
          NS_URL="https://github.com/${{ github.repository }}/releases/download/snapshot-latest/EngagementCloudSDKNotificationService.xcframework.zip"

          sed -e "s|__SDK_URL__|$SDK_URL|" \
              -e "s|__SDK_CHECKSUM__|${{ env.SDK_CHECKSUM }}|" \
              -e "s|__NS_URL__|$NS_URL|" \
              -e "s|__NS_CHECKSUM__|${{ env.NS_CHECKSUM }}|" \
              iosReleaseSpm/Package.swift > /tmp/Package.swift

      - name: Force-push Package.swift to snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git worktree add --detach /tmp/snapshot-worktree
          cd /tmp/snapshot-worktree

          git checkout --orphan snapshot
          git rm -rf --quiet . || true
          cp /tmp/Package.swift Package.swift
          git add Package.swift
          git commit -m "Snapshot Package.swift for ${{ needs.derive-version.outputs.version }} (${GITHUB_SHA::7})"
          git push --force origin snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reporting:
    if: always()
    needs: [ derive-version, build, test, lint, publish-android, publish-js, publish-ios-snapshot ]
    runs-on: ubuntu-latest
    steps:
      - name: Compute pipeline summary
        id: pipelines
        run: |
          SUMMARY=""
          if [ "${{ needs.publish-android.result }}" = "success" ]; then
            SUMMARY="${SUMMARY} KMP:✅"
          elif [ "${{ needs.publish-android.result }}" = "skipped" ]; then
            SUMMARY="${SUMMARY} KMP:⏭️"
          else
            SUMMARY="${SUMMARY} KMP:❌"
          fi
          if [ "${{ needs.publish-js.result }}" = "success" ]; then
            SUMMARY="${SUMMARY} NPM:✅"
          elif [ "${{ needs.publish-js.result }}" = "skipped" ]; then
            SUMMARY="${SUMMARY} NPM:⏭️"
          else
            SUMMARY="${SUMMARY} NPM:❌"
          fi
          if [ "${{ needs.publish-ios-snapshot.result }}" = "success" ]; then
            SUMMARY="${SUMMARY} iOS:✅"
          elif [ "${{ needs.publish-ios-snapshot.result }}" = "skipped" ]; then
            SUMMARY="${SUMMARY} iOS:⏭️"
          else
            SUMMARY="${SUMMARY} iOS:❌"
          fi
          echo "value=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Report on Slack (Error)
        if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
        uses: megamegax/slack_action@0.3.2
        with:
          webhook_url: '${{env.SLACK_WEBHOOK}}'
          channel: 'mobile-team-ci'
          message: 'Last push build failed! :man-gesturing-no: :blobcatfearful: (snapshot: ${{ needs.derive-version.outputs.version }}) |${{ steps.pipelines.outputs.value }}'
          user_name: 'Engagement Cloud SDK'
          job_status: 'failure'
          user_icon: '${{env.SLACK_ICON}}'
          actions: '[{ "type": "button", "text": "View actions", "url": "https://github.com/emartech/engagement-cloud-sdk/actions" }]'

      - name: Report on Slack (Success)
        if: ${{ !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure') }}
        uses: megamegax/slack_action@0.3.2
        with:
          webhook_url: '${{env.SLACK_WEBHOOK}}'
          channel: 'mobile-team-ci'
          message: 'Last push build successful! :man-gesturing-ok: :bananadance: (snapshot: ${{ needs.derive-version.outputs.version }}) |${{ steps.pipelines.outputs.value }}'
          user_name: 'Engagement Cloud SDK'
          job_status: 'success'
          user_icon: '${{env.SLACK_ICON}}'
          actions: '[{ "type": "button", "text": "View actions", "url": "https://github.com/emartech/engagement-cloud-sdk/actions" }]'

      - name: Trigger automerge
        if: ${{ !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure') && github.event.pull_request != null && github.actor == 'dependabot[bot]' && github.event.pull_request.merged == false}}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.AUTO_MERGE_TOKEN }}
          event-type: checks-complete
          client-payload: '{ "prNumber": "${{ github.event.pull_request.number }}"}'
